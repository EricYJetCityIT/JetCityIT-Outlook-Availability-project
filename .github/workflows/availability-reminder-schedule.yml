name: Weekly availability reminder

# Reminds any active tech who hasn't submitted availability yet for the
# current or next week. Azure Static Web Apps' managed Functions only support
# HTTP triggers, so the actual check (api/src/functions/availabilityReminder.js)
# is an HTTP endpoint instead of a Timer trigger, and this workflow is what
# calls it on a schedule. 15:00 UTC on Monday = 7-8am Pacific depending on DST;
# adjust the cron below if a different time is wanted.
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report who WOULD be emailed, send nothing'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call availability-reminder endpoint
        run: |
          URL="https://crew-calendar.jetcityit.com/api/availability-reminder"
          # inputs.dry_run is only set on manual dispatch; empty on the cron
          # schedule, so scheduled runs always send for real.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            URL="$URL?dry=1"
            echo "DRY RUN — no emails will be sent"
          fi
          echo "POST $URL"
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$URL" \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}"
          echo
