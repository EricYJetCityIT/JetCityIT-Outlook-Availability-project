name: Smartsheet dispatch sync

# Azure Static Web Apps' managed Functions only support HTTP triggers, so
# the actual sync (api/src/functions/smartsheetSync.js) is an HTTP endpoint
# instead of a Timer trigger, and this workflow is what calls it on a
# schedule. SYNC_SECRET must match the SYNC_SECRET app setting on the
# jetcityit-app Static Web App — set both by hand, never in code.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a full resync even if the sheet has not changed (bypasses the modifiedAt cache)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call smartsheet-sync endpoint
        run: |
          URL="https://crew-calendar.jetcityit.com/api/smartsheet-sync"
          if [ "${{ inputs.force }}" = "true" ]; then URL="$URL?force=true"; fi
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$URL" \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}"

      # Auto-checks "Proj Rpt Rec'd" on the Crew Calendar for jobs whose Daily
      # Project Report was just filed via the app (matched by the hidden Job ID
      # on the report). Independent of the sync above — always runs even if the
      # sync step failed.
      - name: Call report-match endpoint
        if: ${{ always() }}
        run: |
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "https://crew-calendar.jetcityit.com/api/report-match" \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}"
